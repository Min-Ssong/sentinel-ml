spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5800}/${POSTGRES_DB:sentineldb}
    username: ${POSTGRES_USER:sentinel}
    password: ${POSTGRES_PASSWORD:sentinel123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  application:
    name: sentinel-ml-api
  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:7379}
  profiles:
    active: local
  kafka:
    bootstrap-servers: localhost:${KAFKA_PORT:9192}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: sentinel-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.sentinel.common.dto.TransactionMessage

server:
  port: ${SPRING_API_PORT:8490}
ml:
  server:
    url: http://localhost:${FASTAPI_PORT:8495}
    # 코드 기본값 50 (SLA 기준) 을 덮어씀. 50ms 실행 시 Fallback 비율은 측정 기록 없음 -> k6 측정 후 결정
    timeout-ms: 5000
  challenger:
    url: http://localhost:${FASTAPI_CHALLENGER_PORT:8496}

# Shadow Deployment (챌린저 병행 추론). 기본 비활성 — 실행 시 --shadow.enabled=true
shadow:
  enabled: false

resilience4j:
  circuitbreaker:
    instances:
      mlScoreClient:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      challengerScoreClient:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus